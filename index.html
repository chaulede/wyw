<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文言文断句、翻译与解析工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif; background-color: #F7F2E7; color: #2B2623; }
    .paper-card { background-color: #FCF9F2; border: 1px solid #E2D7C3; box-shadow: 0 4px 20px rgba(43, 38, 35, 0.05); }
    .practice-char { display: inline-block; padding: 2px 4px; cursor: pointer; border-radius: 4px; transition: background 0.2s; position: relative; }
    .practice-char:hover { background: #EFE6D5; }
    .practice-char.marked { border-bottom: 3px solid #B83B2A; margin-right: 8px; color: #B83B2A; font-weight: bold; }
    .practice-char.marked::after { content: attr(data-punct); position: absolute; right: -12px; bottom: -5px; font-size: 0.8em; color: #B83B2A; }
    #infoModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: #FCF9F2; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .rule-card { border-left: 4px solid #B83B2A; background: #FFF8EB; padding: 10px; border-radius: 4px; margin-bottom: 8px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="border-b border-[#E2D7C3] bg-[#FCF9F2] px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded bg-[#B83B2A] text-[#FCF9F2] font-bold text-lg">句</span>
        <h1 class="text-xl font-bold tracking-wider text-[#2B2623]">文言文断句、翻译与解析工具</h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="loadCloudData()" id="btnCloud" class="px-4 py-1.5 rounded-lg bg-[#5C4938] hover:bg-[#47382B] text-[#FCF9F2] text-sm font-medium transition shadow-sm">
          ☁️ 加载云端题库
        </button>
        <span id="cloudStatus" class="text-xs text-orange-500 font-medium">未加载</span>
        <button onclick="toggleConfig()" class="px-3 py-1.5 rounded-lg border border-[#D4C5AE] text-[#5C4938] text-sm hover:bg-[#EFE6D5]">⚙️ AI 设置</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    
    <!-- 左侧：操作区 -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      
      <!-- AI 设置面板 -->
      <div id="aiConfigPanel" class="hidden paper-card rounded-xl p-4 flex-col gap-2">
        <h2 class="font-bold text-sm text-[#5C4938]">DeepSeek 翻译设置</h2>
        <input id="apiKeyInput" type="password" placeholder="sk-..." class="w-full p-2 rounded border border-[#DCD0BC] bg-[#F7F2E7] text-sm">
        <select id="modelSelect" class="w-full p-2 rounded border border-[#DCD0BC] bg-[#F7F2E7] text-sm">
          <option value="deepseek-chat">deepseek-chat (V3 快速版)</option>
          <option value="deepseek-reasoner">deepseek-reasoner (R1 思考版)</option>
        </select>
        <button onclick="saveAIConfig()" class="w-full py-1.5 rounded bg-[#5C4938] text-[#FCF9F2] text-sm hover:bg-[#47382B]">保存设置</button>
      </div>

      <!-- 文件上传与文本输入 -->
      <div class="paper-card rounded-xl p-4 flex flex-col gap-3">
        <h2 class="font-bold text-sm text-[#5C4938]">一、输入或上传文本</h2>
        
        <div class="flex flex-wrap gap-2">
           <label class="cursor-pointer px-3 py-1.5 rounded bg-[#B83B2A] text-[#FCF9F2] text-xs hover:bg-[#9E3021] transition">
              📁 上传文件 (TXT/Word/PDF/图片)
              <input type="file" id="fileInput" accept=".txt,.docx,.pdf,image/*" class="hidden" onchange="handleFileUpload(event)">
           </label>
           <button onclick="toggleScript()" class="px-3 py-1.5 rounded border border-[#D4C5AE] text-xs text-[#5C4938] hover:bg-[#EFE6D5]">🔄 繁简转换</button>
        </div>
        <div id="statusBar" class="hidden text-xs text-blue-600 bg-blue-50 p-2 rounded">处理中...</div>

        <textarea id="rawInput" rows="6" placeholder="请粘贴无标点文言文，或上传文件..." class="w-full p-3 rounded bg-[#F7F2E7] border border-[#DCD0BC] text-sm leading-relaxed resize-none"></textarea>
        
        <button onclick="startPractice()" class="w-full py-2 rounded-lg bg-[#B83B2A] hover:bg-[#9E3021] text-[#FCF9F2] font-bold shadow-sm transition">
          ✏️ 生成断句练习
        </button>
        <button onclick="showAnswer()" class="w-full py-2 rounded-lg border border-[#B83B2A] text-[#B83B2A] font-bold hover:bg-[#FFF8EB] transition">
          👁️ 查看规则生成的答案
        </button>
      </div>

      <!-- 题库选择区 -->
      <div class="paper-card rounded-xl p-4 flex flex-col gap-3">
         <h2 class="font-bold text-sm text-[#5C4938]">二、标准原文（云端题库）</h2>
         <div class="flex gap-2">
           <select id="textSelect" class="flex-1 p-2 rounded bg-[#F7F2E7] border border-[#DCD0BC] text-sm">
             <option value="">-- 请先点击右上角加载题库 --</option>
           </select>
           <button onclick="showStandardText()" class="px-3 py-2 rounded bg-[#5C4938] text-[#FCF9F2] text-sm hover:bg-[#47382B]">查看</button>
        </div>
      </div>

    </section>

    <!-- 右侧：展示区 -->
    <section class="lg:col-span-8 flex flex-col">
      <div class="paper-card rounded-xl p-6 flex-1 flex flex-col relative">
        <div class="flex justify-between items-center pb-2 mb-4 border-b border-[#E6DCCB]">
          <h2 id="viewTitle" class="font-bold text-lg text-[#5C4938]">显示区</h2>
          <span class="text-xs text-gray-500" id="hintText">等待操作...</span>
        </div>
        
        <!-- 文本展示容器 -->
        <div id="outputContainer" class="flex-1 overflow-y-auto text-xl leading-loose tracking-wide mb-4">
          <div class="text-center text-[#9A8C7D] py-16 text-base">请从左侧输入文本并开始练习，或选择标准原文。</div>
        </div>

        <!-- DeepSeek 翻译区 -->
        <div id="translationArea" class="hidden mt-4 pt-4 border-t border-[#E6DCCB]">
           <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold text-[#5C4938]">🤖 DeepSeek 逐句翻译</h3>
              <button onclick="startTranslate()" class="px-3 py-1 bg-[#B83B2A] text-[#FCF9F2] text-xs rounded hover:bg-[#9E3021]">开始翻译</button>
           </div>
           <div id="translationResult" class="text-sm leading-relaxed text-[#4A443F] bg-[#FFF8EB] p-4 rounded border border-[#E2D7C3] min-h-[100px]">
              等待翻译...
           </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 弹窗 -->
  <div id="infoModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-4 border-b border-[#E2D7C3] pb-2">
        <h3 id="modalTitle" class="text-lg font-bold text-[#B83B2A]"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-black">✕</button>
      </div>
      <div id="modalBody" class="text-sm leading-relaxed text-[#4A443F] space-y-3"></div>
    </div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let t2sConverter = null, s2tConverter = null;
    if (window.OpenCC) {
      t2sConverter = OpenCC.Converter({ from: 'tw', to: 'cn' });
      s2tConverter = OpenCC.Converter({ from: 'cn', to: 'tw' });
    }

    let CLOUD_DATA = { shici: [], xuci: [], jushi: [], texts: [], rules: {} };
    let isDataLoaded = false;
    let currentMode = ''; // 'standard_view', 'practice', 'upload'
    let currentRawClean = ''; 
    let standardPunctMap = {}; 
    let standardRuleExplain = {}; 
    let userMarks = {}; 
    let isTrad = false; // 是否繁体

    // ==================== 1. DeepSeek 设置 ====================
    window.toggleConfig = function() {
      const panel = document.getElementById('aiConfigPanel');
      panel.classList.toggle('hidden');
      panel.classList.toggle('flex');
    };
    window.saveAIConfig = function() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const model = document.getElementById('modelSelect').value;
      localStorage.setItem('deepseek_key', key);
      localStorage.setItem('deepseek_model', model);
      alert('AI 设置已保存到本地浏览器！');
      toggleConfig();
    };
    // 初始化读取本地设置
    document.getElementById('apiKeyInput').value = localStorage.getItem('deepseek_key') || '';
    document.getElementById('modelSelect').value = localStorage.getItem('deepseek_model') || 'deepseek-chat';

    // ==================== 2. 加载云端题库 ====================
    window.loadCloudData = async function() {
      const btn = document.getElementById('btnCloud');
      const status = document.getElementById('cloudStatus');
      btn.disabled = true;
      status.innerText = '连接 GitHub...';
      
      const base = 'https://raw.githubusercontent.com/chaulede/wyw/main/';
      
      try {
        const [dataShici, dataXuci, dataJushi, dataCz, dataGz, dataRules] = await Promise.all([
          fetch(base + '实词_合集.json').then(r => r.json()),
          fetch(base + '虚词_合集.json').then(r => r.json()),
          fetch(base + '句式_合集.json').then(r => r.json()),
          fetch(base + 'cz.json').then(r => r.json()),
          fetch(base + 'gz.json').then(r => r.json()),
          fetch(base + '古文断句标点规则库.json').then(r => r.json()).catch(() => ({})) 
        ]);

        CLOUD_DATA.shici = dataShici;
        CLOUD_DATA.xuci = dataXuci;
        CLOUD_DATA.jushi = dataJushi;
        CLOUD_DATA.rules = dataRules;

        const extractTexts = (jsonObj) => {
           if (jsonObj['文言文文章']) return jsonObj['文言文文章'].map(item => ({ title: item['篇名'], content: item['正文'] }));
           return [];
        };
        CLOUD_DATA.texts = [...extractTexts(dataCz), ...extractTexts(dataGz)];

        isDataLoaded = true;
        status.innerText = '✅ 题库已加载';
        status.className = 'text-xs text-green-600 font-medium';
        
        const sel = document.getElementById('textSelect');
        sel.innerHTML = '<option value="">-- 请选择要查看的课文 --</option>';
        CLOUD_DATA.texts.forEach((t, idx) => {
          sel.innerHTML += `<option value="${idx}">${t.title}</option>`;
        });

      } catch (err) {
        status.innerText = '❌ 加载失败';
        status.className = 'text-xs text-red-500 font-medium';
      } finally {
        btn.disabled = false;
      }
    };

    // ==================== 3. 文件上传与 OCR 解析 ====================
    window.handleFileUpload = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      event.target.value = '';
      const name = file.name.toLowerCase();
      const statusBar = document.getElementById('statusBar');
      
      statusBar.classList.remove('hidden');
      statusBar.innerText = '正在解析文件，请稍候...';

      try {
        let text = '';
        if (name.endsWith('.txt')) {
          text = await file.text();
        } else if (name.endsWith('.docx')) {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          text = result.value;
        } else if (name.endsWith('.pdf')) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join('') + '\n';
          }
          const chineseChars = fullText.replace(/[^\u4e00-\u9fa5]/g, '');
          if (chineseChars.length >= 10) {
             text = fullText.trim();
          } else {
             statusBar.innerText = '检测到扫描版 PDF，正在调用 OCR 识别...';
             let scannedText = '';
             for (let i = 1; i <= pdf.numPages; i++) {
               const page = await pdf.getPage(i);
               const viewport = page.getViewport({ scale: 2.0 });
               const canvas = document.createElement('canvas');
               const ctx = canvas.getContext('2d');
               canvas.width = viewport.width;
               canvas.height = viewport.height;
               await page.render({ canvasContext: ctx, viewport }).promise;
               const ocrRes = await runOcr(canvas);
               scannedText += ocrRes + '\n';
             }
             text = scannedText.trim();
          }
        } else if (file.type.startsWith('image/')) {
          statusBar.innerText = '正在识别图片文字...';
          text = await runOcr(file);
        }

        document.getElementById('rawInput').value = text;
        // 自动去除标点并开启练习
        startPracticeFromUploadedText(text);

      } catch (err) {
        alert('文件解析失败: ' + err.message);
      } finally {
        statusBar.classList.add('hidden');
      }
    };

    async function runOcr(imageSource) {
      const worker = await Tesseract.createWorker('chi_sim+chi_tra');
      const { data: { text } } = await worker.recognize(imageSource);
      await worker.terminate();
      return text.replace(/[ \t]+/g, '').replace(/\n+/g, '').trim();
    }

    function startPracticeFromUploadedText(text) {
      document.getElementById('rawInput').value = text;
      startPractice();
    }

    // ==================== 4. 繁简转换 ====================
    window.toggleScript = function() {
      const ta = document.getElementById('rawInput');
      if (!ta.value.trim()) return;
      if (isTrad) {
        ta.value = t2sConverter(ta.value);
        isTrad = false;
      } else {
        ta.value = s2tConverter(ta.value);
        isTrad = true;
      }
    };

    // ==================== 5. 核心逻辑：练习与规则引擎 ====================
    window.showStandardText = function() {
      const sel = document.getElementById('textSelect');
      const idx = sel.value;
      if (idx === "") { alert('请先选择课文'); return; }
      
      const textObj = CLOUD_DATA.texts[idx];
      currentMode = 'standard_view';
      
      document.getElementById('viewTitle').innerText = `📖 原文查看：${textObj.title}`;
      document.getElementById('hintText').innerText = '标准原文，不可修改';
      
      const container = document.getElementById('outputContainer');
      container.innerHTML = `<div class="p-6 bg-white border border-[#E2D7C3] rounded-lg shadow-sm leading-loose text-xl tracking-wider" style="text-indent: 2em;">
        ${textObj.content.replace(/\n/g, '<br><br>')}
      </div>`;
      
      document.getElementById('translationArea').classList.add('hidden');
    };

    window.startPractice = function() {
      const raw = document.getElementById('rawInput').value.trim();
      if (!raw) { alert('请先输入文言文'); return; }
      
      currentRawClean = raw.replace(/[^\u4e00-\u9fa5]/g, '');
      currentMode = 'practice';
      userMarks = {}; 
      
      const result = runEngineFromRules(currentRawClean);
      standardPunctMap = result.punctMap;
      standardRuleExplain = result.ruleExplain;

      renderPracticeView();
      document.getElementById('viewTitle').innerText = '✏️ 断句练习区';
      document.getElementById('hintText').innerText = '点击汉字之间的空白添加标点，点击已有标点查看解析';
      document.getElementById('translationArea').classList.remove('hidden');
      document.getElementById('translationResult').innerText = '点击上方“开始翻译”调用 AI...';
    };

    function runEngineFromRules(clean) {
      const n = clean.length;
      const punctMap = {};
      const ruleExplain = {}; 

      if (isDataLoaded && CLOUD_DATA.rules.sentence_end) {
          const particles = CLOUD_DATA.rules.sentence_end.particles;
          for (let i = 0; i < n; i++) {
             const ch = clean[i];
             const pRule = particles.find(p => p.char === ch);
             if (pRule) {
                 let skip = false;
                 if (pRule.exceptions) {
                     pRule.exceptions.forEach(ex => {
                         if (ex.context.includes('者') && clean[i+1] === '者') skip = true;
                         if (ex.context.includes('则') && clean[i+1] === '则') { punctMap[i] = '，'; skip = true; }
                     });
                 }
                 if (!skip) {
                     punctMap[i] = pRule.punct || '。';
                     ruleExplain[i] = pRule;
                 }
             }
          }
      }

      if (isDataLoaded && CLOUD_DATA.rules.fixed_structures) {
          const structs = CLOUD_DATA.rules.fixed_structures;
          structs.forEach(st => {
              if (!st.regex) return;
              try {
                  const re = new RegExp(st.regex, 'g');
                  let match;
                  while ((match = re.exec(clean)) !== null) {
                      const start = match.index;
                      const end = start + match[0].length - 1;
                      if (st.mark_after && !punctMap[end]) {
                          punctMap[end] = st.mark_after;
                          ruleExplain[end] = st;
                      }
                  }
              } catch(e) {}
          });
      }

      if (!punctMap[n-1]) {
          punctMap[n-1] = '。';
          ruleExplain[n-1] = { label: '句意结束', note: '全句语义完整。' };
      }

      return { punctMap, ruleExplain };
    }

    // ==================== 6. 渲染与交互 ====================
    function renderPracticeView() {
      const container = document.getElementById('outputContainer');
      let html = '<div class="p-6 bg-white border border-[#E2D7C3] rounded-lg leading-loose text-xl tracking-wider">';
      for (let i = 0; i < currentRawClean.length; i++) {
        const char = currentRawClean[i];
        const hasMark = userMarks[i] !== undefined;
        const markClass = hasMark ? 'marked' : '';
        const punctAttr = hasMark ? `data-punct="${userMarks[i]}"` : '';
        html += `<span class="practice-char ${markClass}" ${punctAttr} data-index="${i}" onclick="handleCharClick(${i})">${char}</span>`;
        if (i < currentRawClean.length - 1) html += `<span class="text-gray-300 mx-0.5">|</span>`;
      }
      html += '</div>';
      container.innerHTML = html;
    }

    window.handleCharClick = function(index) {
      if (userMarks[index] !== undefined) {
        showPunctAnalysis(index, userMarks[index]);
        return;
      }
      const punct = prompt(`在「${currentRawClean[index]}」后添加标点：`, '，');
      if (punct && ['，', '。', '？', '！', '；'].includes(punct)) {
        userMarks[index] = punct;
        renderPracticeView();
      }
    };

    window.showAnswer = function() {
      if (currentMode !== 'practice' || !currentRawClean) { alert('请先生成练习'); return; }
      document.getElementById('viewTitle').innerText = '👁️ 规则生成的比对答案';
      
      const container = document.getElementById('outputContainer');
      let html = '<div class="p-6 bg-white border border-[#E2D7C3] rounded-lg leading-loose text-xl tracking-wider">';
      for (let i = 0; i < currentRawClean.length; i++) {
        html += `<span>${currentRawClean[i]}</span>`;
        if (standardPunctMap[i]) {
          html += `<span class="text-[#B83B2A] font-bold cursor-pointer hover:scale-125 inline-block mx-1 transition" onclick="showPunctAnalysis(${i}, '${standardPunctMap[i]}', true)">${standardPunctMap[i]}</span>`;
        }
      }
      html += '</div>';
      container.innerHTML = html;
    };

    window.showPunctAnalysis = function(index, punct, isFromAnswerView = false) {
      const charBefore = currentRawClean[index];
      let statusHtml = '';
      if (currentMode === 'practice' && !isFromAnswerView) {
        const isCorrect = standardPunctMap[index] === punct;
        statusHtml = isCorrect ? '<span class="text-green-600 font-bold">✅ 正确</span>' : `<span class="text-red-500 font-bold">❌ 有误（标准为「${standardPunctMap[index] || '不断'}」）</span>`;
      }

      let html = '';
      if (standardRuleExplain[index]) {
          const ruleObj = standardRuleExplain[index];
          html += `<div class="rule-card">`;
          html += `<div class="font-bold text-[#B83B2A] mb-1">📏 判定规则：</div>`;
          if (ruleObj.label) html += `<p class="text-sm">${ruleObj.label}</p>`;
          if (ruleObj.note) html += `<p class="text-xs text-gray-600 mt-1">${ruleObj.note}</p>`;
          html += `</div>`;
      } else {
          html += `<div class="rule-card"><p class="text-sm">根据语意结构或句末语气停顿。</p></div>`;
      }

      if (isDataLoaded) {
          let xuciInfo = '';
          const targetXuci = CLOUD_DATA.xuci.find(item => item.zi === charBefore || item.zi === punct);
          if (targetXuci) {
            xuciInfo += `<ul class="list-disc pl-4 space-y-1 text-xs text-gray-600">`;
            targetXuci.body.forEach(item => { if (item[0]) xuciInfo += `<li><b>${item[0]}</b> ${item[1]||''}</li>`; });
            xuciInfo += `</ul>`;
            html += `<div class="mb-2"><div class="text-xs font-bold text-[#B83B2A] mb-1">📚 虚词用法：</div>${xuciInfo}</div>`;
          }
          let shiciInfo = '';
          const targetShici = CLOUD_DATA.shici.find(item => item.字 === charBefore);
          if (targetShici) {
            shiciInfo += `<ul class="list-disc pl-4 space-y-1 text-xs text-gray-600">`;
            targetShici.义项.forEach(item => { shiciInfo += `<li><b>${item.义项}</b> 例：${item.例句}</li>`; });
            shiciInfo += `</ul>`;
            html += `<div class="mb-2"><div class="text-xs font-bold text-[#B83B2A] mb-1">📖 实词义项：</div>${shiciInfo}</div>`;
          }
      }

      document.getElementById('modalTitle').innerHTML = `「${charBefore}」后标点解析 ${statusHtml}`;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('infoModal').style.display = 'flex';
    };

    window.closeModal = function(e) {
      if (e && e.target !== document.getElementById('infoModal')) return;
      document.getElementById('infoModal').style.display = 'none';
    };

    // ==================== 7. DeepSeek 翻译逻辑 ====================
    window.startTranslate = async function() {
      const key = localStorage.getItem('deepseek_key');
      if (!key) { alert('请先点击右上角 ⚙️ AI 设置，填入 DeepSeek API Key。'); return; }
      
      const model = localStorage.getItem('deepseek_model') || 'deepseek-chat';
      const resultDiv = document.getElementById('translationResult');
      
      // 获取当前带标点的完整文本
      let fullText = '';
      if (currentMode === 'standard_view') {
         fullText = document.getElementById('outputContainer').innerText; // 简单抽取
      } else {
         fullText = currentRawClean.split('').map((c, i) => c + (standardPunctMap[i] || '')).join('');
      }

      resultDiv.innerHTML = '<div class="text-blue-500 animate-pulse">DeepSeek 正在思考与翻译，请稍候...</div>';

      try {
        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: '你是古代汉语文学专家。请对用户提供的文言文进行逐句翻译，并给出重点字词注释。要求排版清晰，先给出完整意译，再列出重点字词解析。' },
              { role: 'user', content: fullText }
            ],
            temperature: 0.3
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || '请求失败');
        }

        const data = await response.json();
        const content = data.choices[0].message.content;
        
        // 简单把换行转成 HTML
        resultDiv.innerHTML = content.replace(/\n/g, '<br>');

      } catch (error) {
        resultDiv.innerHTML = `<div class="text-red-500">翻译出错：${error.message}<br>请检查 API Key 是否有效或余额是否充足。</div>`;
      }
    };

    window.onload = function() {
      document.getElementById('rawInput').value = "陈胜者阳城人也字涉吴广者阳夏人也字叔陈涉少时尝与人佣耕辍耕之垄上怅恨久之曰苟富贵无相忘佣者笑而应曰若为佣耕何富贵也陈涉太息曰嗟乎燕雀安知鸿鹄之志哉";
    };
  </script>
